<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="How the Enterprise AI Assistant answers: a question goes to an agent that plans searches, uses a policy-search tool (vector and full-text search, rank fusion and reranking) and a read-only database tool with row-level access, then streams an answer with numbered citations.">
<defs><radialGradient id="g1" cx="88%" cy="0%" r="70%"><stop offset="0" stop-color="#1b2c66" stop-opacity=".7"/><stop offset="1" stop-color="#0b1020" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#0f4a3a" stop-opacity=".5"/><stop offset="1" stop-color="#0b1020" stop-opacity="0"/></radialGradient>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9z" fill="#5d6b8c"/></marker></defs>
<rect width="1600" height="900" fill="#0b1020"/><rect width="1600" height="900" fill="url(#g1)"/><rect width="1600" height="900" fill="url(#g2)"/>
<rect x="70" y="60" width="1460" height="780" rx="26" fill="#0f1626" stroke="#222c44" stroke-width="2"/>
<text x="110" y="118" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#e8ecf6">How the assistant answers</text>
<text x="110" y="148" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#93a0bd">An agent decides which tools to use, repeats until it has the evidence, then answers with citations.</text>
<line x1="70" y1="176" x2="1530" y2="176" stroke="#222c44" stroke-width="2"/>
<!-- question -->
<rect x="110" y="380" width="220" height="130" rx="16" fill="#141d31" stroke="#2a344d" stroke-width="2"/>
<text x="220" y="420" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#7f8db0" letter-spacing="2">QUESTION</text>
<text x="220" y="458" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#e8ecf6">User asks</text><text x="220" y="486" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#e8ecf6">in chat</text>
<line x1="332" y1="445" x2="388" y2="445" stroke="#5d6b8c" stroke-width="3" marker-end="url(#a)"/>
<!-- agent -->
<rect x="390" y="340" width="260" height="210" rx="16" fill="#16224a" stroke="#7196ff" stroke-width="2"/>
<text x="520" y="384" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9db6ff" letter-spacing="2">AI AGENT</text>
<text x="520" y="428" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Plans and</text><text x="520" y="462" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff">searches</text>
<text x="520" y="500" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#b4c3ec">calls tools in a loop until</text><text x="520" y="522" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#b4c3ec">it has enough evidence</text>
<!-- tool 1: policy -->
<line x1="652" y1="410" x2="716" y2="300" stroke="#5d6b8c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="718" y="200" width="520" height="190" rx="16" fill="#141d31" stroke="#2a344d" stroke-width="2"/>
<rect x="718" y="200" width="8" height="190" rx="4" fill="#3ddc97"/>
<text x="748" y="236" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#3ddc97" letter-spacing="2">TOOL · POLICY SEARCH</text>
<rect x="748" y="256" width="108" height="86" rx="12" fill="#101829" stroke="#7196ff" stroke-width="1.5"/><text x="802" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e8ecf6">Vector</text><text x="802" y="310" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e8ecf6">search</text><text x="802" y="332" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#93a0bd">pgvector</text><rect x="866" y="256" width="108" height="86" rx="12" fill="#101829" stroke="#7196ff" stroke-width="1.5"/><text x="920" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e8ecf6">Full-text</text><text x="920" y="310" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e8ecf6">search</text><text x="920" y="332" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#93a0bd">tsvector</text><rect x="984" y="256" width="108" height="86" rx="12" fill="#101829" stroke="#e8b54a" stroke-width="1.5"/><text x="1038" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e8ecf6">Rank</text><text x="1038" y="310" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e8ecf6">fusion</text><text x="1038" y="332" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#93a0bd">RRF</text><rect x="1102" y="256" width="108" height="86" rx="12" fill="#101829" stroke="#b392f0" stroke-width="1.5"/><text x="1156" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e8ecf6">Reranker</text><text x="1156" y="310" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e8ecf6"></text><text x="1156" y="332" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#93a0bd">cross-encoder</text><text x="748" y="368" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#93a0bd">Table-aware chunking keeps policy tables intact.</text><!-- tool 2: database -->
<line x1="652" y1="480" x2="716" y2="590" stroke="#5d6b8c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="718" y="500" width="520" height="190" rx="16" fill="#141d31" stroke="#2a344d" stroke-width="2"/>
<rect x="718" y="500" width="8" height="190" rx="4" fill="#e8b54a"/>
<text x="748" y="536" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#e8b54a" letter-spacing="2">TOOL · DATABASE</text>
<rect x="748" y="556" width="108" height="86" rx="12" fill="#101829" stroke="#7196ff" stroke-width="1.5"/><text x="802" y="594" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#e8ecf6">Inspect</text><text x="802" y="620" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#93a0bd">schema</text><rect x="866" y="556" width="108" height="86" rx="12" fill="#101829" stroke="#7196ff" stroke-width="1.5"/><text x="920" y="594" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#e8ecf6">Query</text><text x="920" y="620" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#93a0bd">one SELECT</text><rect x="984" y="556" width="108" height="86" rx="12" fill="#101829" stroke="#3ddc97" stroke-width="1.5"/><text x="1038" y="594" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#e8ecf6">Row-level</text><text x="1038" y="620" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#93a0bd">per user</text><rect x="1102" y="556" width="108" height="86" rx="12" fill="#101829" stroke="#ff7a90" stroke-width="1.5"/><text x="1156" y="594" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#e8ecf6">Limits</text><text x="1156" y="620" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#93a0bd">read-only</text><text x="748" y="668" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#93a0bd">Each user sees only the data their role allows.</text><line x1="1240" y1="295" x2="1300" y2="400" stroke="#5d6b8c" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1240" y1="595" x2="1300" y2="490" stroke="#5d6b8c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="1302" y="360" width="190" height="170" rx="16" fill="#0f2a24" stroke="#1f5a47" stroke-width="2"/>
<text x="1397" y="398" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6fd9a8" letter-spacing="2">ANSWER</text>
<text x="1397" y="436" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#e8ecf6">Streamed,</text><text x="1397" y="462" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#e8ecf6">with citations</text>
<text x="1397" y="496" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#93a0bd">[1] [2] open the</text><text x="1397" y="516" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#93a0bd">exact page</text>
<rect x="110" y="740" width="1380" height="70" rx="14" fill="#141d31" stroke="#2a344d"/>
<text x="136" y="770" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#7f8db0" letter-spacing="2">WHY IT IS BUILT THIS WAY</text>
<text x="136" y="796" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#d7deee">A question can need facts from several places. The agent searches, reads, searches again and only then answers, so every claim is backed by evidence.</text>
</svg>