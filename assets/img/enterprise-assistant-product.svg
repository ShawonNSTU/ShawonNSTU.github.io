id + reranked</text><circle cx="408" cy="332" r="9" fill="none" stroke="#3ddc97" stroke-width="2.5"/><path d="M403 332 l3.5 3.5 l7 -8" stroke="#3ddc97" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="432" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#e8ecf6">Read 2 sources</text><text x="432" y="351" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#93a0bd">Refund windows · add-on exceptions</text><circle cx="408" cy="382" r="9" fill="none" stroke="#e8b54a" stroke-width="2.5"/><circle cx="408" cy="382" r="3.5" fill="#e8b54a"/><text x="432" y="380" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#e8ecf6">Writing answer</text><text x="432" y="401" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#93a0bd">Grounded in the evidence above</text><rect x="392" y="432" width="640" height="330" rx="16" fill="#141d31" stroke="#2a344d" stroke-width="2"/><text x="418" y="476" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#d7deee">The refund window depends on the plan type and the</text><text x="418" y="506" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#d7deee">purchase date.</text><text x="418" y="548" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#d7deee">The window for each plan type is listed in the refund</text><text x="418" y="578" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#d7deee">table [1], and the exceptions for add-ons are in the</text><text x="418" y="608" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#d7deee">add-on table [2].</text><text x="418" y="650" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#d7deee">Combine the two to find the exact deadline. Ask me if</text><text x="418" y="680" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#d7deee">you want me to walk through an example.</text><rect x="418" y="714" width="64" height="30" rx="15" fill="#16224a" stroke="#7196ff"/><text x="450" y="734" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#9db6ff">[1] p.4</text><rect x="494" y="714" width="64" height="30" rx="15" fill="#16224a" stroke="#7196ff"/><text x="526" y="734" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#9db6ff">[2] p.9</text><rect x="392" y="780" width="640" height="52" rx="26" fill="#101829" stroke="#2a344d" stroke-width="2"/><text x="420" y="812" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#5d6b8c">Ask a question about your documents…</text><circle cx="1000" cy="806" r="18" fill="#7196ff"/><path d="M994 806 h12 m-5 -5 l5 5 l-5 5" stroke="#0b1020" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="1066" y="232" width="448" height="600" rx="16" fill="#141d31" stroke="#2a344d" stroke-width="2"/><text x="1092" y="272" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#7f8db0" letter-spacing="2">SOURCES</text><rect x="1092" y="296" width="396" height="126" rx="14" fill="#101829" stroke="#2a344d"/><rect x="1110" y="314" width="34" height="34" rx="9" fill="#16224a" stroke="#7196ff"/><text x="1127" y="338" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#9db6ff">1</text><text x="1160" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#e8ecf6">Product policy.pdf</text><text x="1160" y="354" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#93a0bd">Section 3 · page 4</text><text x="1110" y="392" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#c6d2f0">Refund windows table</text><text x="1488" y="392" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#7196ff">Open page ↗</text><rect x="1092" y="444" width="396" height="126" rx="14" fill="#101829" stroke="#2a344d"/><rect x="1110" y="462" width="34" height="34" rx="9" fill="#16224a" stroke="#7196ff"/><text x="1127" y="486" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#9db6ff">2</text><text x="1160" y="478" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#e8ecf6">Product policy.pdf</text><text x="1160" y="502" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#93a0bd">Section 5 · page 9</text><text x="1110" y="540" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#c6d2f0">Add-on exceptions table</text><text x="1488" y="540" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#7196ff">Open page ↗</text><rect x="1092" y="598" width="396" height="100" rx="14" fill="#0f2a24" stroke="#1f5a47"/><text x="1110" y="630" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6fd9a8" letter-spacing="2">ACCESS</text>
